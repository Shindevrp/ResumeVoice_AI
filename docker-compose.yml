services:

  vllm:
    image: vllm/vllm-openai:latest
    container_name: resumevoice-vllm
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - MODEL=${RESUMEVOICE_LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      - MAX_MODEL_LEN=${RESUMEVOICE_VLLM_MAX_LEN:-4096}
      - GPU_MEMORY_UTILIZATION=${RESUMEVOICE_VLLM_GPU_UTIL:-0.90}
      - DTYPE=${RESUMEVOICE_VLLM_DTYPE:-float16}
      - QUANTIZATION=awq
      - API_KEY=${RESUMEVOICE_VLLM_API_KEY:-EMPTY}
    command:
      - "--model"
      - "${RESUMEVOICE_LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}"
      - "--max-model-len"
      - "${RESUMEVOICE_VLLM_MAX_LEN:-4096}"
      - "--gpu-memory-utilization"
      - "${RESUMEVOICE_VLLM_GPU_UTIL:-0.90}"
      - "--dtype"
      - "${RESUMEVOICE_VLLM_DTYPE:-float16}"
      - "--quantization"
      - "awq"
      - "--port"
      - "8000"
      - "--host"
      - "0.0.0.0"
    ports:
      - "8001:8000"
    volumes:
      - vllm_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - resumevoice-net

  resumevoice:
    image: resumevoice_ai-resumevoice:hostfix2
    container_name: resumevoice-app
    network_mode: host
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - RESUMEVOICE_LLM_URL=${RESUMEVOICE_LLM_URL:-http://127.0.0.1:11434/v1}
      - RESUMEVOICE_HOST=0.0.0.0
      - RESUMEVOICE_LLM_MODEL=${RESUMEVOICE_LLM_MODEL:-qwen2.5:3b}
      - RESUMEVOICE_STT_MODEL=${RESUMEVOICE_STT_MODEL:-base}
      - RESUMEVOICE_STT_DEVICE=${RESUMEVOICE_STT_DEVICE:-cuda}
      - RESUMEVOICE_STT_COMPUTE=${RESUMEVOICE_STT_COMPUTE:-float16}
      - RESUMEVOICE_TTS_MODEL=/app/models/piper/en_US-lessac-medium.onnx
      - RESUMEVOICE_TTS_DEVICE=${RESUMEVOICE_TTS_DEVICE:-cuda}
      - RESUMEVOICE_VAD_DEVICE=${RESUMEVOICE_VAD_DEVICE:-cuda}
      - RESUMEVOICE_VAD_THRESHOLD=${RESUMEVOICE_VAD_THRESHOLD:-0.45}
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - stt_cache:/root/.cache
      - ./models/piper:/app/models/piper
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  vllm_cache:
  stt_cache:

networks:
  resumevoice-net:
    driver: bridge