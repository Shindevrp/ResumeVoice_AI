<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="ResumeVoice AI - your personal voice agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#8957e5"/>
    </linearGradient>
  </defs>

  <rect width="900" height="200" fill="url(#bg)"/>
  <rect x="0" y="0" width="900" height="4" fill="url(#accent)"/>

  <text x="450" y="92" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" fill="#e6edf3">ResumeVoice AI</text>
  <text x="450" y="128" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#8b949e">Your personal voice agent — listen, understand, speak.</text>
</svg>
