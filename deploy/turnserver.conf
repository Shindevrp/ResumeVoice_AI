# coturn — TURN relay for WebRTC media across NAT.
# Replace IPs with your public and LAN IPs (see deploy/README.md).
listening-port=3478
realm=resumevoice.local
fingerprint

# Static long-term credential (also set in RESUMEVOICE_TURN_USERNAME/CREDENTIAL).
user=resumevoice:CHANGE_ME_TURN_PASSWORD

# Media relay allocation range.
min-port=49160
max-port=49200

# Mapp public IP -> private LAN IP of this machine.
external-ip=202.164.135.184/192.168.1.189

no-cli
log-file=stdout